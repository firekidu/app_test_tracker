name: Live site check

# Read-only check of the deployed site from the internet (GET requests only).
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/live-check.yml']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SITE: ${{ vars.APP_URL || 'https://57-131-28-237.sslip.io' }}
    steps:
      - name: HTTPS certificate
        run: |
          host=$(echo "$SITE" | sed -E 's#https?://##; s#/.*##')
          echo | openssl s_client -connect "$host:443" -servername "$host" 2>/dev/null | openssl x509 -noout -subject -issuer -dates || true
      - name: Health (certificate checked)
        continue-on-error: true
        run: curl -sS -m 20 -w '\nHTTP %{http_code}\n' "$SITE/api/health"
      - name: What the proxy answers (certificate not checked, HTTPS and HTTP)
        run: |
          http="http://${SITE#https://}"
          for u in "$SITE/api/health" "$http/api/health" "$SITE/login" "$http/login"; do
            echo "== $u"
            curl -sS -k -m 20 -D - -o /tmp/body "$u" | grep -iE '^(HTTP|location|server|content-type)' || true
            head -c 300 /tmp/body; echo
          done
      - name: Pages
        continue-on-error: true
        run: |
          for p in /login / /activity /api/sheet; do
            curl -sS -k -m 20 -o /tmp/body -w "$p → %{http_code} %{redirect_url}\n" "$SITE$p"
          done
          curl -sS -k -m 20 "$SITE/login" | grep -o '<title>[^<]*</title>' || true
